name: Test

# Runs the whole test system on every push and pull request — "each page,
# every feature tested before deployment" as an actual gate, not just
# something run by hand. A red check here means don't merge/deploy.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend tests (Vitest + React Testing Library)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: temple-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: temple-calendar/package-lock.json
      - run: npm ci
      - run: npm test

  backend:
    name: Backend tests (Vitest + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # Real AWS is never touched (DynamoDB/SES are mocked in every
          # test), so no real credentials are needed here — just enough
          # env presence that modules requiring JWT_SECRET etc. don't warn.
          NODE_ENV: test
