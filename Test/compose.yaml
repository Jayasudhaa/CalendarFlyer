name: calendarfly-test
x-test-env: &test-env
  ADMIN_USERNAME: local-admin
  ADMIN_PASSWORD: local-test-password
  APP_ENV: local
  NODE_ENV: production
  PORT: 5000
  FRONTEND_URL: http://localhost:5100
  AWS_REGION: us-east-2
  AWS_ACCESS_KEY_ID: localtest
  AWS_SECRET_ACCESS_KEY: localtest
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
  JWT_SECRET: local-only-calendarfly-jwt-secret-do-not-use-online
  SESSION_SECRET: local-only-calendarfly-session-secret-do-not-use-online
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    volumes:
      - test-database:/home/dynamodblocal/data
    networks: [isolated]
  initialize:
    build: .
    environment: *test-env
    command: [node, local-init.cjs]
    depends_on: [dynamodb]
    networks: [isolated]
    restart: "no"
  app:
    build: .
    environment: *test-env

    depends_on:
      initialize:
        condition: service_completed_successfully
    networks: [isolated]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:5100:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [default, isolated]
networks:
  isolated:
    internal: true
volumes:
  test-database:
